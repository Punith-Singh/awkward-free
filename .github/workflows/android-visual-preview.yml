name: Android visual preview
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/android-visual-preview.yml'
      - 'scripts/capture-visual-preview.sh'
      - 'app/src/main/java/com/punith/awkwardfree/navigation/AwkwardApp.kt'
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash scripts/capture-visual-preview.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-visual-preview
          path: visual-preview/*.png
          if-no-files-found: warn
          retention-days: 7
